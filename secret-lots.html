<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Lots — Sims Codex</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="secret-lots">

<div id="site-header"></div>

<header class="hero" style="padding:60px 0 20px;">
  <div class="wrap hero-inner">
    <div class="eyebrow"><span class="diamond" style="background:var(--coral)"></span>Hidden &amp; Unlockable</div>
    <h1>Secret Lots</h1>
    <p class="lede">The worlds and lots that don't show up until you know exactly what to do.</p>
  </div>
</header>

<section class="wrap section" style="padding-top:0;">
  <div class="toolbar" id="lotToolbar"></div>
  <div id="lotGrid"></div>
</section>

<div id="site-footer" class="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/pages.js"></script>
<script>
  initNav('secret-lots');

  initGridPage({
    dataKey: "secretLots",
    gridId: "lotGrid",
    toolbarId: "lotToolbar",
    filterField: "world",
    filterParam: "filter",
    searchFields: ["name", "description", "how_to_unlock"],
    emptyMessage: "No secret lots logged yet.",
    renderCard: (row) => `
      <div class="card" id="${slugify(row.name)}">
        ${thumbHtml(row.image_url, row.name)}
        <span class="meta"><span class="diamond" style="width:6px;height:6px;background:var(--coral)"></span>${row.world || "Unknown world"}</span>
        <h3>${row.name}</h3>
        <p>${row.description || ""}</p>
        <p style="font-family:var(--font-mono); font-size:0.78rem; background:rgba(212,160,23,0.12); padding:8px 10px; border-radius:6px; color:#5c4a12;">
          <strong>Unlock:</strong> ${row.how_to_unlock || "Not documented yet."}
        </p>
      </div>`,
  });
</script>
</body>
</html>
